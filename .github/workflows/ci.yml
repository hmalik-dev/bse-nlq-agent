name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -w web lint

      - name: Typecheck
        run: npm run -w web typecheck

      - name: Tests
        run: npm run -w web test

      - name: Build
        run: npm run -w web build
