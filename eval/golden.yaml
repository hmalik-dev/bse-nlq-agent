- id: nets-home-games-in-july
  question: Which Brooklyn Nets home games were played in July 2026?
  tags: [empty, join, filter]
  expect: empty
  sql: |-
    SELECT e.name, e.event_date
    FROM events e
    JOIN teams h ON h.team_id = e.home_team_id
    WHERE h.name = 'Brooklyn Nets'
      AND e.event_date >= '2026-07-01' AND e.event_date < '2026-08-01'
    ORDER BY e.event_date

- id: promo-orders-this-year
  question: How many orders used a promo code this year?
  tags: [simple, filter, relative-date]
  expect: answered
  sql: |-
    SELECT COUNT(*) AS orders_with_promo
    FROM orders
    WHERE promo_code IS NOT NULL
      AND ordered_at >= '2026-01-01' AND ordered_at < '2027-01-01'

- id: concert-refunds-2025
  question: How many tickets were refunded for concerts held in 2025?
  tags: [join, filter]
  expect: answered
  sql: |-
    SELECT COUNT(*) AS refunded_tickets
    FROM tickets t
    JOIN events e ON e.event_id = t.event_id
    WHERE t.status = 'refunded'
      AND e.category = 'Concert'
      AND e.event_date >= '2025-01-01' AND e.event_date < '2026-01-01'

- id: tickets-sold-q1-2026
  question: How many tickets did we sell in the first quarter of 2026?
  tags: [simple, join, filter, ambiguous]
  expect: answered
  sql: |-
    SELECT COUNT(*) AS tickets_sold
    FROM tickets t
    JOIN orders o ON o.order_id = t.order_id
    WHERE t.status = 'sold'
      AND o.ordered_at >= '2026-01-01' AND o.ordered_at < '2026-04-01'

- id: top-nets-opponent-2025-26
  question: Which opponent sold the most tickets at Brooklyn Nets home games in the 2025-26 season?
  tags: [join, filter]
  expect: answered
  sql: |-
    SELECT a.name AS opponent, COUNT(*) AS tickets_sold
    FROM tickets t
    JOIN events e ON e.event_id = t.event_id
    JOIN teams h ON h.team_id = e.home_team_id
    JOIN teams a ON a.team_id = e.away_team_id
    WHERE t.status = 'sold'
      AND h.name = 'Brooklyn Nets'
      AND e.season = '2025-26'
    GROUP BY a.team_id
    ORDER BY tickets_sold DESC
    LIMIT 1

- id: tickets-sold-yesterday
  question: How many tickets did we sell yesterday?
  tags: [simple, join, filter, relative-date]
