# Fly.io: one warm machine, one volume, the container from the Dockerfile.
# Renaming the app means changing `app`, the two `bse-insights.fly.dev` host
# values below and the README link; scripts/deploy.sh and the tests read the
# name from here.
# The API key is a Fly secret set by scripts/deploy.sh, never a value in this file.
app = "bse-insights"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  NLQ_DATABASE_PATH = "/data/tickets.db"
  # A fifth of the data seeds in seconds on first boot and answers every example.
  NLQ_SEED_SCALE = "0.2"
  # The API refuses any other Host header (docs/security.md).
  NLQ_ALLOWED_HOSTS = "bse-insights.fly.dev"

[mounts]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # The first boot seeds before the server listens; the grace period covers it.
  [[http_service.checks]]
    grace_period = "5m"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
    [http_service.checks.headers]
      Host = "bse-insights.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
